# The part of the reload test that differs per module.  ci/reload.sh sources
# this with $WORK and $PORT already set and then drives the reloads.
#
#     RELOAD_HTTP    directives for the http block, may be empty
#     RELOAD_SERVER  directives for the server block
#     RELOAD_EXPECT  what reload_probe has to print
#     reload_probe   prints what the server answered
#
# Every cycle arms a timer, and a timer that outlives its cycle points into
# a pool that has been freed.  ci/reload.sh watches the master's
# descriptors and the workers' exit codes; a timer left behind shows up
# there as a worker that dies on a signal rather than leaving quietly.

RELOAD_HTTP="
    cert_expiry_warn 14d;
    cert_expiry_check 1s;"

RELOAD_SERVER="
        location /probe {
            return 200 \"up\";
        }"

RELOAD_EXPECT='up'

reload_probe() {
	curl -s --max-time 5 "http://127.0.0.1:$PORT/probe"
}
